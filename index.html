/* Wireframes for the R1 public screens and Today (docs/12-design-brief.md §3, §7). Variant D tokens, light first.
   Real ts12 data of 24 Oct 2026 everywhere except Today, which is illustrative (an R2 screen). Throwaway. */
:root{--font:'Inter',system-ui,sans-serif;--radius:8px;--pad:16px;--row:40px;--fs:14px;--content:1080px;
 --bg:#eee5d6;--surface:#f8f3ea;--line:#d4cec1;--text:#2a1c14;--muted:#6a5646;--accent:#b01e35;--accent-weak:#b01e351a;--pos:#3d6b2c;--neg:#a3471b;
 --bar:#e2d5bf;--bar-line:#d3c4aa;--rail:#f3ecdf;--input:#f3ecdf;--fill:#8c7a63;--track:#e2d8c6;
 --f1:#093aff;--f2:#099e1e;--f3:#ff9e00;--f4:#e60909;--f5:#8b8b8b;--f1h:#7d97ff;--f2h:#6fcb7c;--f3h:#ffd04a;--f4h:#f27676;--f5h:#c4c4c4}
html[data-theme=dark]{--bg:#1a1512;--surface:#231c17;--line:#3a2f26;--text:#efe6d4;--muted:#b0a089;--accent:#e07a83;--accent-weak:#e07a8322;--pos:#8fbf6a;--neg:#f0965e;
 --bar:#231c17;--bar-line:#3a2f26;--rail:#1f1915;--input:#1a1512;--fill:#a8977e;--track:#3a2f26;
 --f1:#3a63ff;--f2:#1fb337;--f3:#ffa31a;--f4:#f03434;--f5:#8b8b8b;--f1h:#9db0ff;--f2h:#86d892;--f3h:#ffd666;--f4h:#f79a9a;--f5h:#cfcfcf}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.note{background:var(--accent-weak);color:var(--text);font-size:12.5px;padding:6px max(16px,env(safe-area-inset-left));text-align:center}
.top{position:sticky;top:0;z-index:10;background:var(--bar);border-bottom:1px solid var(--bar-line)}
.top .in{max-width:calc(var(--content) + 240px);margin:0 auto;display:flex;gap:12px;align-items:center;padding:10px max(16px,env(safe-area-inset-left))}
.brand{font-weight:600;color:var(--accent);white-space:nowrap}
.chip{display:inline-flex;align-items:center;border:1px solid var(--bar-line);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:13px;white-space:nowrap;background:transparent;font:inherit;font-size:13px;cursor:pointer}
.search{flex:1 1 300px;max-width:420px;margin-left:auto;border:1px solid var(--bar-line);border-radius:var(--radius);padding:7px 10px;color:var(--muted);background:var(--input);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:var(--radius);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--accent);color:#fff}
.shell{max-width:calc(var(--content) + 240px);margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:0 max(16px,env(safe-area-inset-left))}
/* wider pages on big screens (owner, 28 Oct 2026): from 1,680 px the page grows with the window, about 50 px from each edge, up to a 2,200 px content column (Full HD about 1,580 px, 2K the full 2,200); "Hide menu" still gives the whole width */
@media (min-width:1680px){:root{--content:min(2200px,calc(100vw - 340px))}}
.rail{position:sticky;top:57px;align-self:start;padding:18px 0}
.rail h4{margin:16px 8px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:6px;color:var(--text)}
main{padding:22px 0 90px;min-width:0}
.crumbs{color:var(--muted);font-size:13px}
.pathbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}.pbsep{color:var(--muted);padding:0 2px}
.pbseg{position:relative}.pbseg summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:2px 7px;margin:0 -3px;border-radius:6px;color:var(--text);font-weight:500}.pbseg summary::-webkit-details-marker{display:none}
.pbseg summary:hover,.pbseg[open] summary{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--accent)}.pbseg .chev{width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.6}
.pbmenu{position:absolute;top:calc(100% + 4px);left:-3px;z-index:40;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:5px;display:flex;flex-direction:column}
.pbi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:none;font:inherit;font-size:13.5px;color:var(--text);padding:6px 9px;border-radius:6px;cursor:pointer}.pbi:hover{background:var(--bg);color:var(--accent)}.pbi.on{color:var(--accent);font-weight:600}.pbi.soon{color:var(--muted);cursor:default}.pbi.soon .nyi{font-size:11px}
h1{font-size:26px;letter-spacing:-.02em;margin:4px 0 2px;font-weight:600}
.meta{color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.tile,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);min-width:0}
.tile .k{color:var(--muted);font-size:12.5px}.tile .n{font-size:22px;font-weight:600;margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.panel h2{font-size:14.5px;margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);padding:0 10px;height:36px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:0 10px;height:var(--row);white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right}.muted{color:var(--muted)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.badge{display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:500;white-space:nowrap}
.badge.q{background:transparent;border:1px solid var(--line);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters .f{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;font-size:13px;color:var(--muted)}
.filters .f b{color:var(--text);font-weight:500}
.prov{color:var(--muted);font-size:12.5px;margin-top:14px}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--fill)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
svg text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.sec{margin:26px 0 10px;font-size:17px;font-weight:600;color:var(--text);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small{font-size:13px;font-weight:400;color:var(--muted)}
.tip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:11px;font-weight:600;cursor:help;position:relative;vertical-align:middle;margin-left:4px;background:transparent;padding:0}
#tipbox{position:fixed;z-index:60;max-width:min(280px,calc(100vw - 24px));background:var(--text);color:var(--bg);font-weight:400;font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:6px;text-align:left;white-space:normal;pointer-events:none;box-shadow:0 2px 8px #0003}
.mini{width:100%;border-collapse:collapse;margin-top:8px}.mini td{height:32px;font-size:13px;white-space:normal}.mini td.num{white-space:nowrap}.mini td:first-child{padding-left:0}
.check{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.chip .dot{margin-right:6px}
.dot{--c:var(--f5);--h:var(--f5h);display:inline-block;flex:none;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:-1px;
 background:radial-gradient(circle at 34% 28%,#fff 0,#fff0 28%),radial-gradient(circle at 42% 34%,var(--h) 0,var(--c) 58%,color-mix(in srgb,var(--c) 72%,#000) 100%);
 box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--c) 60%,#000),0 .5px 1px #0003}
.dot.f1{--c:var(--f1);--h:var(--f1h)}.dot.f2{--c:var(--f2);--h:var(--f2h)}.dot.f3{--c:var(--f3);--h:var(--f3h)}.dot.f4{--c:var(--f4);--h:var(--f4h)}.dot.f5{--c:var(--f5);--h:var(--f5h)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:12px;color:var(--muted)}.legend .dot{width:8px;height:8px;margin-right:5px}

.zero{color:var(--muted);opacity:.55}
.vtabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line);margin:-4px 0 12px;flex-wrap:wrap}
.vtabs button{border:0;background:none;font:inherit;font-size:14px;color:var(--muted);padding:6px 10px 9px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}.vtabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.dt.tt th .ui{vertical-align:-3px}.dt.tt td{vertical-align:middle}
.sel2,.txt{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--text)}.txt{width:110px}
.pform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin:6px 0 4px 16px;font-size:13px}.pform label{display:flex;flex-direction:column;gap:4px;color:var(--muted)}.pform label.nw{flex-direction:row;align-items:center;gap:6px;color:var(--text)}
.pform .wide{grid-column:1/-1}.pform .txt{width:100%}.pform fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}.pform legend{color:var(--muted);padding:0;margin-bottom:4px;width:100%}
.dt tr.pick{cursor:pointer}.dt tr.pick:hover td{background:var(--accent-weak)}.dt tr.pick.on td{background:var(--accent-weak)}
.mine-strip{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0 0 12px;font-size:13.5px}
.tiles.inpanel{margin:4px 0 6px}.tiles.inpanel .tile{background:var(--bg)}
.ffilt{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:12px 18px;font-size:13px;align-items:start}.ffilt label{display:flex;flex-direction:column;gap:4px;color:var(--muted)}.ffilt label.nw{flex-direction:row;align-items:center;gap:5px;color:var(--text)}.ffilt .txt{width:100%}
.ffilt fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}.ffilt legend{color:var(--muted);padding:0;margin-bottom:4px}.ffilt .wide{grid-column:1/-1;margin:0}.ffilt .pair{display:flex;gap:6px}.ffilt fieldset:nth-of-type(1){grid-column:1/3}.dt.ft td.num .sub2{display:block}
.ibtn.eye{margin-left:0;width:30px;padding:0;justify-content:center;background:transparent;border-color:var(--line);color:var(--muted)}.ibtn.eye:hover{color:var(--accent);border-color:var(--accent)}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}.pg2{display:flex;gap:4px;flex-wrap:wrap}.pg2 .chip.on{border-color:var(--accent);color:var(--accent)}.pg2 .chip[disabled]{border-color:transparent;cursor:default}
.sr{display:inline-block;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;vertical-align:top}
.strip{display:inline-flex;border-radius:5px;overflow:hidden;font-size:12.5px;font-variant-numeric:tabular-nums}.strip span{min-width:38px;padding:2px 6px;text-align:center}.strip span+span{border-left:1px solid var(--surface)}
.strip .z,.sw.z{background:color-mix(in srgb,var(--f1) 16%,var(--surface))}.strip .g,.sw.g{background:color-mix(in srgb,var(--f4) 30%,var(--surface))}.strip .l,.sw.l{background:color-mix(in srgb,var(--f2) 26%,var(--surface))}.strip .n{background:var(--track);color:var(--muted)}

addEventListener('click',e=>{ document.querySelectorAll('.pbseg[open]').forEach(d=>{ if(!d.contains(e.target)) d.open=false; }); });
new MutationObserver(()=>{ const r=(location.hash||'#today').slice(1); scanNote(r); if(!document.querySelector('#view .twov')) twoVersionsNote(r); pathBar(); markOverflow(); }).observe(document.getElementById('view'),{childList:true});
const tipbox=Object.assign(document.createElement('div'),{id:'tipbox',hidden:true}); tipbox.setAttribute('role','tooltip'); document.body.appendChild(tipbox);
function showTip(el){ if(el.dataset.tiph) tipbox.innerHTML=el.dataset.tiph; else tipbox.textContent=el.dataset.tip; tipbox.hidden=false; const r=el.getBoundingClientRect(), tw=tipbox.offsetWidth, th=tipbox.offsetHeight;
 const x=Math.max(12,Math.min(r.left+r.width/2-tw/2, innerWidth-tw-12)); let y=r.bottom+8; if(y+th>innerHeight-8) y=Math.max(8,r.top-th-8);
 tipbox.style.left=x+'px'; tipbox.style.top=y+'px'; }
function hideTip(){ tipbox.hidden=true; }
addEventListener('mouseover',e=>{ const t=e.target.closest('[data-tip]'); if(t) showTip(t); });
addEventListener('mouseout',e=>{ if(e.target.closest('[data-tip]')) hideTip(); });
addEventListener('focusin',e=>{ const t=e.target.closest('[data-tip]'); if(t) showTip(t); });
addEventListener('focusout',hideTip); addEventListener('scroll',hideTip,true);
addEventListener('click',e=>{ const t=e.target.closest('.tip'); if(t){ tipbox.hidden||tipbox.textContent!==t.dataset.tip?showTip(t):hideTip(); } });
function themeLabel(){ return document.documentElement.dataset.theme==='light'?'Dark':'Light'; }
function toggleTheme(){ const h=document.documentElement; h.dataset.theme=h.dataset.theme==='light'?'dark':'light'; document.querySelectorAll('.theme-btn').forEach(b=>b.textContent=themeLabel()); }
</script>
